name: Daily update newwex-pan

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch source, trim to pan sites, clean names
        run: python3 trim.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- newwex-pan.json; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add newwex-pan.json
            git commit -m "Daily auto-update: refresh pan-only config"
            git push
            curl -s "https://purge.jsdelivr.net/gh/q1azq1a/wex-pan@main/newwex-pan.json" > /dev/null || true
            echo "Updated and pushed."
          fi
